version: '3.8'

services:
  # 1. Reverse Proxy & Router (Nginx)
  nginx:
    image: nginx:alpine
    container_name: hrsystem_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
      - frontend
      - bridge
    networks:
      - hrsystem_net

  # 2. Web Frontend (Next.js 15 App Router)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrsystem_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    networks:
      - hrsystem_net

  # 3. Core REST API (Laravel 11 / PHP 8.3-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrsystem_backend
    volumes:
      - ./backend:/var/www/html
      - storage_private:/var/www/html/storage/app/private
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:3f0N8qF1d2G3h4J5k6L7m8N9p0Q1r2S3t4U5v6W7x8Y=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hrsystem_db
      - DB_USERNAME=hrsystem_user
      - DB_PASSWORD=SecretHrDbPassword2026!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrsystem_net

  # 4. Hardware ADMS Biometric Bridge (Node.js Fastify)
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: hrsystem_bridge
    environment:
      - PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hrsystem_net

  # 5. BullMQ & Puppeteer Workers (PDF Payslips & Punch Pairing)
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: hrsystem_workers
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hrsystem_db
      - DB_USERNAME=hrsystem_user
      - DB_PASSWORD=SecretHrDbPassword2026!
      - LARAVEL_PRIVATE_STORAGE_PATH=/var/www/html/storage/app/private
    volumes:
      - storage_private:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrsystem_net

  # 6. Primary Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: hrsystem_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=RootSecretHr2026!
      - MYSQL_DATABASE=hrsystem_db
      - MYSQL_USER=hrsystem_user
      - MYSQL_PASSWORD=SecretHrDbPassword2026!
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecretHr2026!"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrsystem_net

  # 7. Cache & Queue Broker (Redis 7 Alpine)
  redis:
    image: redis:7-alpine
    container_name: hrsystem_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrsystem_net

networks:
  hrsystem_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_private:

